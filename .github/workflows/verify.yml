name: Verify C++ study references
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate structure, metadata and links
        run: python3 scripts/validate_structure.py
      - name: Execute all reference solutions with undefined-behavior checks
        run: python3 scripts/test_solutions.py --sanitize
